        </div>
        <div class="table-wrap"><table>
          <thead><tr>
            <th>Item</th><th class="r">Cost per ${cat.unit}</th><th class="r">Basis</th>
            <th class="r">On shelf</th><th class="r">Value</th><th></th>
          </tr></thead>
          <tbody>${items.map(i => {
            const low = num(i.lowAt) > 0 && num(i.stock) <= num(i.lowAt);
            return `<tr>
              <td class="tname">${esc(i.name)}${i.notes ? `<span class="tsub">${esc(i.notes)}</span>` : ''}</td>
              <td class="r num">${money(unitCost(i))}</td>
              <td class="r faint" style="font-size:.76rem;">${i.costMode === 'bulk'
                ? `${money(num(i.bulkCost))} / ${qty(i.bulkQty)} ${cat.unit}`
                : 'entered directly'}</td>
              <td class="r num">${qty(i.stock)} ${cat.unit}${low ? ' <span class="tag tag-lit">low</span>' : ''}</td>
              <td class="r num faint">${money(num(i.stock) * unitCost(i))}</td>
              <td class="r"><div class="row-actions">
                <button class="btn btn-quiet btn-sm" onclick="openStockModal('ingredient','${i.id}')">Stock</button>
                <button class="btn btn-quiet btn-sm" onclick="openIngredientModal('${i.id}')">Edit</button>
                <button class="btn btn-quiet btn-sm btn-warn" onclick="removeIngredient('${i.id}')">Delete</button>
              </div></td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
      </div>`;
  }).join('');

  document.getElementById('view-ingredients').innerHTML = `
    <div class="section-head">
      <div>
        <span class="eyebrow">Raw materials</span>
        <h2>Ingredients</h2>
        <p class="lede">Wax, fragrance, wicks, dye and packaging. Enter a unit cost, or enter what a bulk purchase cost and let the unit cost fall out of it.</p>
      </div>
      <button class="btn btn-solid" onclick="openIngredientModal()">Add ingredient</button>
    </div>
    ${state.ingredients.length ? groups : `
    <div class="panel"><div class="empty">
      <h4>The shelf is bare</h4>
      <p>Add your wax first — it is the ingredient every recipe leans on hardest.</p>
      <button class="btn" onclick="openIngredientModal()">Add ingredient</button>
    </div></div>`}`;
}

function openIngredientModal(id){
  const i = id ? findIngredient(id) : null;
  const cat = i ? i.category : 'wax';
  openModal(`
    <div class="modal-head">
      <h3>${i ? 'Edit ingredient' : 'Add ingredient'}</h3>
      <button class="x" onclick="closeModal()">&times;</button>
    </div>
    <div class="inline-fields">
      <div class="field">
        <label for="iName">Name</label>
        <input type="text" id="iName" value="${esc(i ? i.name : '')}" placeholder="Golden Brands 464 soy">
      </div>
      <div class="field">
        <label for="iCat">Category</label>
        <select id="iCat" onchange="ingredientCatChanged()">
          ${CATEGORIES.map(c => `<option value="${c.id}" ${c.id === cat ? 'selected' : ''}>${c.label} (${c.unit})</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="field">
      <label>How is the cost entered?</label>
      <div class="seg" id="iCostMode">
        <button type="button" data-mode="unit" class="${!i || i.costMode !== 'bulk' ? 'active' : ''}" onclick="setCostMode('unit')">Per unit</button>
        <button type="button" data-mode="bulk" class="${i && i.costMode === 'bulk' ? 'active' : ''}" onclick="setCostMode('bulk')">From a bulk buy</button>
      </div>
    </div>

    <div id="costUnit" style="display:${!i || i.costMode !== 'bulk' ? 'block' : 'none'}">
      <div class="field">
        <label for="iUnitCost">Cost per <span class="unitLbl">${categoryUnit(cat)}</span></label>
        <input type="number" id="iUnitCost" step="0.001" min="0" value="${i ? num(i.unitCost) : ''}">
      </div>
    </div>
    <div id="costBulk" style="display:${i && i.costMode === 'bulk' ? 'block' : 'none'}">
      <div class="inline-fields">
        <div class="field">
          <label for="iBulkQty">Quantity bought (<span class="unitLbl">${categoryUnit(cat)}</span>)</label>
          <input type="number" id="iBulkQty" step="0.01" min="0" value="${i ? num(i.bulkQty) : ''}" oninput="previewBulk()">
        </div>
        <div class="field">
          <label for="iBulkCost">What it cost</label>
          <input type="number" id="iBulkCost" step="0.01" min="0" value="${i ? num(i.bulkCost) : ''}" oninput="previewBulk()">
        </div>
      </div>
      <div class="hint" id="bulkPreview">&nbsp;</div>
    </div>

    <div class="divider"></div>
    <div class="inline-fields">
      <div class="field">
        <label for="iStock">On shelf (<span class="unitLbl">${categoryUnit(cat)}</span>)</label>
        <input type="number" id="iStock" step="0.01" min="0" value="${i ? num(i.stock) : 0}">
      </div>
      <div class="field">
        <label for="iLow">Warn at or below</label>
        <input type="number" id="iLow" step="0.01" min="0" value="${i ? num(i.lowAt) : 0}">
      </div>
    </div>
    <div class="field">
      <label for="iNotes">Note</label>
      <input type="text" id="iNotes" value="${esc(i ? i.notes || '' : '')}" placeholder="supplier, lot, scent family">
    </div>
    <div class="modal-foot">
      <button class="btn btn-quiet" onclick="closeModal()">Cancel</button>
      <button class="btn btn-solid" onclick="saveIngredient(${i ? "'" + i.id + "'" : 'null'})">${i ? 'Save changes' : 'Add ingredient'}</button>
    </div>`);
  previewBulk();
}

function setCostMode(mode){
  document.querySelectorAll('#iCostMode button').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('costUnit').style.display = mode === 'unit' ? 'block' : 'none';
  document.getElementById('costBulk').style.display = mode === 'bulk' ? 'block' : 'none';
  previewBulk();
}
function currentCostMode(){
  const active = document.querySelector('#iCostMode button.active');
  return active ? active.dataset.mode : 'unit';
}
function ingredientCatChanged(){
  const u = categoryUnit(document.getElementById('iCat').value);
  document.querySelectorAll('.unitLbl').forEach(el => el.textContent = u);
  previewBulk();
}
function previewBulk(){
  const el = document.getElementById('bulkPreview');
  if (!el) return;
  const q = num(document.getElementById('iBulkQty').value);
  const c = num(document.getElementById('iBulkCost').value);
  const u = categoryUnit(document.getElementById('iCat').value);
  el.innerHTML = q > 0 ? `Works out to <span class="mono">${money(c / q)}</span> per ${u}.` : '&nbsp;';
}

function saveIngredient(id){
  const name = document.getElementById('iName').value.trim();
  if (!name){ toast('Give the ingredient a name', true); return; }
  const mode = currentCostMode();
  const data = {
    name,
    category: document.getElementById('iCat').value,
    costMode: mode,
    unitCost: num(document.getElementById('iUnitCost').value),
    bulkQty: num(document.getElementById('iBulkQty').value),
    bulkCost: num(document.getElementById('iBulkCost').value),
    stock: num(document.getElementById('iStock').value),
    lowAt: num(document.getElementById('iLow').value),
    notes: document.getElementById('iNotes').value.trim()
  };
  if (id) Object.assign(findIngredient(id), data);
  else state.ingredients.push(Object.assign({id: uid()}, data));
  markDirty(); closeModal(); renderAll();
  toast(id ? 'Ingredient updated' : 'Ingredient added');
}

function removeIngredient(id){
  const used = state.recipes.filter(r =>
    r.waxId === id || r.fragranceId === id || r.dyeId === id ||
    (r.wicks || []).some(w => w.id === id) ||
    (r.packaging || []).some(p => p.id === id));
  if (used.length){
    toast('Used by ' + used.length + ' recipe' + (used.length === 1 ? '' : 's') + ' — change those first', true);
    return;
  }
  state.ingredients = state.ingredients.filter(i => i.id !== id);
  markDirty(); renderAll(); toast('Ingredient deleted');
}

/* ---------------------- stock adjustment ---------------------- */

function openStockModal(kind, id){
  const item = kind === 'container' ? findContainer(id) : findIngredient(id);
  const unit = kind === 'container' ? 'each' : categoryUnit(item.category);
  openModal(`
    <div class="modal-head">
      <h3>${esc(item.name)}</h3>
      <button class="x" onclick="closeModal()">&times;</button>
    </div>
    <p class="dim" style="margin-top:0;">On shelf now: <span class="mono">${qty(item.stock)} ${unit}</span></p>
    <div class="inline-fields">
      <div class="field">
        <label for="stAdd">Received (add)</label>
        <input type="number" id="stAdd" step="0.01" min="0" placeholder="0">
      </div>
      <div class="field">
        <label for="stSet">Or set the count to</label>
        <input type="number" id="stSet" step="0.01" min="0" placeholder="counted by hand">
      </div>
    </div>
    <div class="hint">Setting a count wins over adding, so use it after a shelf count.</div>
    <div class="modal-foot">
      <button class="btn btn-quiet" onclick="closeModal()">Cancel</button>
      <button class="btn btn-solid" onclick="applyStock('${kind}','${id}')">Update stock</button>
    </div>`);
}

function applyStock(kind, id){
  const item = kind === 'container' ? findContainer(id) : findIngredient(id);
  const setVal = document.getElementById('stSet').value;
  const addVal = document.getElementById('stAdd').value;
  if (setVal !== '') item.stock = num(setVal);
  else if (addVal !== '') item.stock = num(item.stock) + num(addVal);
  else { closeModal(); return; }
  markDirty(); closeModal(); renderAll();
  toast('Stock updated');
}
</script>
<script>
/* =====================================================================
   RECIPES
   ===================================================================== */

function renderRecipes(){
  const cards = state.recipes.map(r => {
    const b = costBreakdown(r);
    const c = findContainer(r.containerId);
    const max = maxFromStock(r);
    return `
      <div class="panel">
        <div class="panel-head">
          <div>
            <h3>${esc(r.name)}</h3>
            <span class="eyebrow">${c ? esc(c.name) + ' · ' : ''}${qty(waxPerCandle(r))} oz wax${r.fragranceId ? ' · ' + qty(r.fragrancePct) + '% fragrance' : ''}</span>
          </div>
          <div class="row-actions">
            <button class="btn btn-sm" onclick="openBatchModal('${r.id}')">Start batch</button>
            <button class="btn btn-quiet btn-sm" onclick="openRecipeModal('${r.id}')">Edit</button>
            <button class="btn btn-quiet btn-sm btn-warn" onclick="removeRecipe('${r.id}')">Delete</button>
          </div>
        </div>
        <div class="grid g4" style="margin-bottom:18px;">
          <div class="stat"><div class="k">Cost per candle</div><div class="v num sm">${money(b.total)}</div></div>
          <div class="stat"><div class="k">Suggested price</div><div class="v num sm">${money(b.price)}</div><div class="note">&times;${qty(b.markup)} markup</div></div>
          <div class="stat"><div class="k">Margin per candle</div><div class="v num sm">${money(b.price - b.total)}</div><div class="note">${b.price > 0 ? pct(((b.price - b.total) / b.price) * 100) : '—'}</div></div>
          <div class="stat"><div class="k">Stock allows</div><div class="v num sm">${qty(max.count,0)}</div><div class="note">${max.limiter ? esc(max.limiter.name) + ' runs out first' : 'nothing required'}</div></div>
        </div>
        ${meltBar(b)}
        ${r.notes ? `<p class="dim" style="font-size:.84rem;margin:16px 0 0;">${esc(r.notes)}</p>` : ''}
      </div>`;
  }).join('');

  document.getElementById('view-recipes').innerHTML = `
    <div class="section-head">
      <div>
        <span class="eyebrow">Formulations</span>
        <h2>Recipes</h2>
        <p class="lede">Each recipe carries its own cost. The bar under it is one candle, broken into what it is made of.</p>
      </div>
      <button class="btn btn-solid" onclick="openRecipeModal()">Add recipe</button>
    </div>
    ${state.recipes.length ? cards : `
    <div class="panel"><div class="empty">
      <h4>No recipes yet</h4>
      <p>A recipe ties a container to a wax, a fragrance load and a wick. Everything downstream — batches, stock, margin — reads from it.</p>
      <button class="btn" onclick="openRecipeModal()">Build the first recipe</button>
    </div></div>`}`;
}

/* ---------------------- editor ---------------------- */

var draftWicks = [];
var draftPack = [];
var draftFillMode = "volume";

function openRecipeModal(id){
  const r = id ? findRecipe(id) : null;
  draftWicks = r ? JSON.parse(JSON.stringify(r.wicks || [])) : [];
  draftPack  = r ? JSON.parse(JSON.stringify(r.packaging || [])) : [];
  draftFillMode = r ? (r.fillMode || 'volume') : 'volume';
  if (!draftWicks.length) draftWicks = [{id:'', qty:1}];

  const waxes = ingredientsOf('wax');
  const frags = ingredientsOf('fragrance');
  const dyes  = ingredientsOf('dye');

  const opts = (list, sel, blank) =>
    `<option value="">${blank}</option>` +
    list.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.name)}</option>`).join('');

  openModal(`
    <div class="modal-head">
      <h3>${r ? 'Edit recipe' : 'New recipe'}</h3>
      <button class="x" onclick="closeModal()">&times;</button>
    </div>

    <div class="inline-fields">
      <div class="field">
        <label for="rName">Name</label>
        <input type="text" id="rName" value="${esc(r ? r.name : '')}" placeholder="Nevermore — black fig &amp; ash" oninput="previewRecipe()">
      </div>
      <div class="field">
        <label for="rContainer">Container</label>
        <select id="rContainer" onchange="previewRecipe()">
          ${opts(state.containers, r ? r.containerId : '', '— pick a container —')}
        </select>
      </div>
    </div>

    <div class="field">
      <label>Wax quantity</label>
      <div class="seg" id="rFillMode">
        <button type="button" data-mode="volume" class="${draftFillMode === 'volume' ? 'active' : ''}" onclick="setFillMode('volume')">From container volume</button>
        <button type="button" data-mode="weight" class="${draftFillMode === 'weight' ? 'active' : ''}" onclick="setFillMode('weight')">Straight weight</button>
      </div>
    </div>

    <div id="fillVolume" style="display:${draftFillMode === 'volume' ? 'block' : 'none'}">
      <div class="field">
        <label for="rRatio">Fill ratio (oz wax per fl oz)</label>
        <input type="number" id="rRatio" step="0.01" min="0" value="${r ? num(r.fillRatio, state.settings.fillRatio) : num(state.settings.fillRatio)}" oninput="previewRecipe()">
        <div class="hint">Studio default is ${qty(state.settings.fillRatio)}. Override it here if this vessel fills differently.</div>
      </div>
    </div>
    <div id="fillWeight" style="display:${draftFillMode === 'weight' ? 'block' : 'none'}">
      <div class="field">
        <label for="rWaxOz">Wax per candle (oz)</label>
        <input type="number" id="rWaxOz" step="0.1" min="0" value="${r ? num(r.waxOz) : ''}" oninput="previewRecipe()">
      </div>
    </div>

    <div class="inline-fields three">
      <div class="field">
        <label for="rWax">Wax</label>
        <select id="rWax" onchange="previewRecipe()">${opts(waxes, r ? r.waxId : '', '— none —')}</select>
      </div>
      <div class="field">
        <label for="rFrag">Fragrance</label>
        <select id="rFrag" onchange="previewRecipe()">${opts(frags, r ? r.fragranceId : '', '— none —')}</select>
      </div>
      <div class="field">
        <label for="rFragPct">Fragrance load (%)</label>
        <input type="number" id="rFragPct" step="0.5" min="0" value="${r ? num(r.fragrancePct) : 8}" oninput="previewRecipe()">
      </div>
    </div>

    <div class="inline-fields">
      <div class="field">
        <label for="rDye">Dye</label>
        <select id="rDye" onchange="previewRecipe()">${opts(dyes, r ? r.dyeId : '', '— none —')}</select>
      </div>
      <div class="field">
        <label for="rDyeAmt">Dye per candle (g)</label>
        <input type="number" id="rDyeAmt" step="0.1" min="0" value="${r ? num(r.dyeAmt) : ''}" oninput="previewRecipe()">
      </div>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>Wicks</label>
      <div id="wickRows"></div>
      <button class="btn btn-quiet btn-sm" onclick="addWickRow()">Add another wick</button>
    </div>

    <div class="field">
      <label>Packaging</label>
      <div id="packRows"></div>
      <button class="btn btn-quiet btn-sm" onclick="addPackRow()">Add packaging</button>
    </div>

    <div class="divider"></div>

    <div class="inline-fields three">
      <div class="field">
        <label for="rMinutes">Minutes per candle</label>
        <input type="number" id="rMinutes" step="0.5" min="0" value="${r ? num(r.minutes, state.settings.minutesPerCandle) : num(state.settings.minutesPerCandle)}" oninput="previewRecipe()">
      </div>
      <div class="field">
        <label for="rOverhead">Overhead override</label>
        <input type="number" id="rOverhead" step="0.05" min="0" value="${r && r.overheadOverride !== null && r.overheadOverride !== undefined ? num(r.overheadOverride) : ''}" placeholder="${qty(state.settings.overhead)}" oninput="previewRecipe()">
      </div>
      <div class="field">
        <label for="rMarkup">Markup override</label>
        <input type="number" id="rMarkup" step="0.1" min="0" value="${r && r.markupOverride !== null && r.markupOverride !== undefined ? num(r.markupOverride) : ''}" placeholder="${qty(state.settings.markup)}" oninput="previewRecipe()">
      </div>
    </div>

    <div class="field">
      <label for="rNotes">Notes</label>
      <textarea id="rNotes" rows="2" placeholder="cure time, pour temperature, scent notes">${esc(r ? r.notes || '' : '')}</textarea>
    </div>

    <div class="panel" style="margin-bottom:0;">
      <div class="panel-head">
        <h3 style="font-size:.95rem;">Cost as you build it</h3>
        <span class="eyebrow" id="previewTotals"></span>
      </div>
      <div id="recipePreview"></div>
    </div>

    <div class="modal-foot">
      <button class="btn btn-quiet" onclick="closeModal()">Cancel</button>
      <button class="btn btn-solid" onclick="saveRecipe(${r ? "'" + r.id + "'" : 'null'})">${r ? 'Save changes' : 'Add recipe'}</button>
    </div>`, true);

  renderWickRows();
  renderPackRows();
  previewRecipe();
}

function setFillMode(mode){
  draftFillMode = mode;
  document.querySelectorAll('#rFillMode button').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('fillVolume').style.display = mode === 'volume' ? 'block' : 'none';
  document.getElementById('fillWeight').style.display = mode === 'weight' ? 'block' : 'none';
  previewRecipe();
}

function subRow(list, arrName, idx, row){
  return `<div class="sub-row">
    <select onchange="${arrName}[${idx}].id=this.value;previewRecipe()">
      <option value="">— none —</option>
      ${list.map(x => `<option value="${x.id}" ${x.id === row.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
    </select>
    <input type="number" min="0" step="1" value="${num(row.qty,1)}" oninput="${arrName}[${idx}].qty=parseFloat(this.value)||0;previewRecipe()">
    <button class="icon-btn" onclick="${arrName === 'draftWicks' ? 'removeWickRow' : 'removePackRow'}(${idx})" title="Remove">&times;</button>
  </div>`;
}

function renderWickRows(){
  const list = ingredientsOf('wick');
  document.getElementById('wickRows').innerHTML =
    draftWicks.map((row, i) => subRow(list, 'draftWicks', i, row)).join('') ||
    '<p class="hint" style="margin:0 0 10px;">No wicks on this recipe.</p>';
}
function renderPackRows(){
  const list = ingredientsOf('packaging').concat(ingredientsOf('other'));
  document.getElementById('packRows').innerHTML =
    draftPack.map((row, i) => subRow(list, 'draftPack', i, row)).join('') ||
    '<p class="hint" style="margin:0 0 10px;">No packaging on this recipe.</p>';
}
function addWickRow(){ draftWicks.push({id:'', qty:1}); renderWickRows(); previewRecipe(); }
function removeWickRow(i){ draftWicks.splice(i,1); renderWickRows(); previewRecipe(); }
function addPackRow(){ draftPack.push({id:'', qty:1}); renderPackRows(); previewRecipe(); }
function removePackRow(i){ draftPack.splice(i,1); renderPackRows(); previewRecipe(); }

function readRecipeForm(){
  const v = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const optional = id => { const raw = v(id); return raw === '' ? null : num(raw); };
  return {
    name: v('rName').trim(),
    containerId: v('rContainer'),
    fillMode: draftFillMode,
    fillRatio: num(v('rRatio'), state.settings.fillRatio),
    waxOz: num(v('rWaxOz')),
    waxId: v('rWax'),
    fragranceId: v('rFrag'),
    fragrancePct: num(v('rFragPct')),
    dyeId: v('rDye'),
    dyeAmt: num(v('rDyeAmt')),
    wicks: draftWicks.filter(w => w.id),
    packaging: draftPack.filter(p => p.id),
    minutes: num(v('rMinutes'), state.settings.minutesPerCandle),
    overheadOverride: optional('rOverhead'),
    markupOverride: optional('rMarkup'),
    notes: v('rNotes').trim()
  };
}

function previewRecipe(){
  const target = document.getElementById('recipePreview');
  if (!target) return;
  const draft = readRecipeForm();
  const b = costBreakdown(draft);
  target.innerHTML = meltBar(b);
  document.getElementById('previewTotals').textContent =
    `${qty(waxPerCandle(draft))} oz wax · ${money(b.total)} cost · ${money(b.price)} price`;
}

function saveRecipe(id){
  const data = readRecipeForm();
  if (!data.name){ toast('Give the recipe a name', true); return; }
  if (data.fillMode === 'volume' && !data.containerId){
    toast('Pick a container, or switch to straight weight', true); return;
  }
  if (id) Object.assign(findRecipe(id), data);
  else state.recipes.push(Object.assign({id: uid()}, data));
  markDirty(); closeModal(); renderAll();
  toast(id ? 'Recipe updated' : 'Recipe added');
}

function removeRecipe(id){
  const open = state.batches.filter(b => b.recipeId === id && b.status === 'open');
  if (open.length){ toast('Finish or cancel its open batch first', true); return; }
  if (onHand(id) > 0){ toast('There is still finished stock on this recipe', true); return; }
  state.recipes = state.recipes.filter(r => r.id !== id);
  state.finished = state.finished.filter(f => f.recipeId !== id);
  markDirty(); renderAll(); toast('Recipe deleted');
}
</script>
<script>
/* =====================================================================
   BATCHES
   Starting a batch takes materials off the shelf immediately — the wax
   is gone the moment it is in the pot. Finished candles are only
   counted when you say the batch is done.
   ===================================================================== */

function renderBatches(){
  const open = state.batches.filter(b => b.status === 'open');
  const done = state.batches.filter(b => b.status !== 'open').slice().reverse();

  const card = b => {
    const r = findRecipe(b.recipeId);
    return `
      <div class="panel">
        <div class="panel-head">
          <div>
            <h3>${r ? esc(r.name) : 'Deleted recipe'}</h3>
            <span class="eyebrow">${qty(b.count,0)} candles · started ${niceDate(b.startedAt)}${b.completedAt ? ' · finished ' + niceDate(b.completedAt) : ''}</span>
          </div>
          <div class="row-actions">
            ${b.status === 'open' ? `
              <button class="btn btn-solid btn-sm" onclick="completeBatch('${b.id}')">Candles complete</button>
              <button class="btn btn-quiet btn-sm btn-warn" onclick="cancelBatch('${b.id}')">Cancel &amp; restock</button>`
            : `<span class="tag ${b.status === 'complete' ? 'tag-solid' : ''}">${b.status}</span>`}
          </div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Taken from the shelf</th><th class="r">Quantity</th></tr></thead>
          <tbody>${(b.lines || []).map(l => `
            <tr><td>${esc(l.name)}</td><td class="r num">${qty(l.qty)} ${esc(l.unit)}</td></tr>`).join('')}
          </tbody>
        </table></div>
        <p class="hint" style="margin-top:12px;">Cost snapshot: <span class="mono">${money(num(b.unitCost))}</span> per candle,
          <span class="mono">${money(num(b.unitCost) * num(b.count))}</span> for the run.</p>
      </div>`;
  };

  document.getElementById('view-batches').innerHTML = `
    <div class="section-head">
      <div>
        <span class="eyebrow">The pour</span>
        <h2>Batches</h2>
        <p class="lede">Materials come off the shelf when a batch starts. Candles only reach finished stock when you mark the batch complete.</p>
      </div>
      <button class="btn btn-solid" onclick="openBatchModal()" ${state.recipes.length ? '' : 'disabled'}>Start a batch</button>
    </div>

    ${open.length ? `<div class="eyebrow" style="margin-bottom:12px;">Open — ${open.length}</div>${open.map(card).join('')}` : ''}

    ${!open.length && !done.length ? `
    <div class="panel"><div class="empty">
      <h4>No batches yet</h4>
      <p>${state.recipes.length ? 'Pick a recipe and a size. The app will tell you what runs short before you start.' : 'Build a recipe first, then come back and pour it.'}</p>
      <button class="btn" onclick="${state.recipes.length ? 'openBatchModal()' : "showView('recipes')"}">${state.recipes.length ? 'Start a batch' : 'Go to recipes'}</button>
    </div></div>` : ''}

    ${done.length ? `<div class="divider"></div><div class="eyebrow" style="margin-bottom:12px;">History — ${done.length}</div>${done.map(card).join('')}` : ''}`;
}

/* ---------------------- start a batch ---------------------- */

var batchScaleMode = 'count';

function openBatchModal(recipeId){
  if (!state.recipes.length){ toast('Build a recipe first', true); return; }
  batchScaleMode = 'count';
  const sel = recipeId || state.recipes[0].id;
  openModal(`
    <div class="modal-head">
      <h3>Start a batch</h3>
      <button class="x" onclick="closeModal()">&times;</button>
    </div>
    <div class="field">
      <label for="bRecipe">Recipe</label>
      <select id="bRecipe" onchange="batchRecalc()">
        ${state.recipes.map(r => `<option value="${r.id}" ${r.id === sel ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Size the run by</label>
      <div class="seg" id="bScale">
        <button type="button" data-mode="count" class="active" onclick="setBatchScale('count')">Candle count</button>
        <button type="button" data-mode="wax" class="" onclick="setBatchScale('wax')">Total wax</button>
        <button type="button" data-mode="max" class="" onclick="setBatchScale('max')">Max from stock</button>
      </div>
    </div>
    <div class="field" id="bCountField">
      <label for="bCount">Candles</label>
      <input type="number" id="bCount" min="1" step="1" value="6" oninput="batchRecalc()">
    </div>
    <div class="field" id="bWaxField" style="display:none;">
      <label for="bWax">Total wax to pour (oz)</label>
      <input type="number" id="bWax" min="0" step="0.5" value="32" oninput="batchRecalc()">
    </div>
    <div id="batchReadout"></div>
    <div class="modal-foot">
      <button class="btn btn-quiet" onclick="closeModal()">Cancel</button>
      <button class="btn btn-solid" id="bStart" onclick="startBatch()">Start batch</button>
    </div>`, true);
  batchRecalc();
}

function setBatchScale(mode){
  batchScaleMode = mode;
  document.querySelectorAll('#bScale button').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('bCountField').style.display = mode === 'count' ? 'block' : 'none';
  document.getElementById('bWaxField').style.display = mode === 'wax' ? 'block' : 'none';
  batchRecalc();
}

function plannedCount(recipe){
  if (batchScaleMode === 'count') return Math.max(0, Math.floor(num(document.getElementById('bCount').value)));
  if (batchScaleMode === 'wax'){
    const per = waxPerCandle(recipe);
    return per > 0 ? Math.floor(num(document.getElementById('bWax').value) / per) : 0;
  }
  return maxFromStock(recipe).count;
}

function batchRecalc(){
  const recipe = findRecipe(document.getElementById('bRecipe').value);
  const count = plannedCount(recipe);
  const b = costBreakdown(recipe);
  const reqs = requirements(recipe);
  const short = shortages(recipe, count);
  const max = maxFromStock(recipe);

  document.getElementById('batchReadout').innerHTML = `
    <div class="grid g3" style="margin-bottom:16px;">
      <div class="stat"><div class="k">Candles</div><div class="v num sm">${qty(count,0)}</div>
        ${batchScaleMode === 'max' && max.limiter ? `<div class="note">${esc(max.limiter.name)} is the limit</div>` : ''}</div>
      <div class="stat"><div class="k">Wax needed</div><div class="v num sm">${qty(waxPerCandle(recipe) * count)} oz</div></div>
      <div class="stat"><div class="k">Batch cost</div><div class="v num sm">${money(b.total * count)}</div>
        <div class="note">${money(b.total)} each</div></div>
    </div>
    ${short.length ? `
      <div class="panel" style="border-color:var(--flame);margin-bottom:16px;">
        <div class="eyebrow warn-text" style="margin-bottom:10px;">Not enough on the shelf</div>
        ${short.map(s => `<div style="display:flex;justify-content:space-between;gap:12px;font-size:.84rem;padding:5px 0;">
          <span>${esc(s.name)}</span>
          <span class="mono warn-text">short ${qty(s.short)} ${esc(s.unit)}</span>
        </div>`).join('')}
        <p class="hint" style="margin-bottom:0;">You can still start the batch — stock will go negative and you can correct it later.</p>
      </div>` : ''}
    <div class="table-wrap"><table>
      <thead><tr><th>Will be deducted</th><th class="r">Per candle</th><th class="r">This batch</th><th class="r">On shelf</th></tr></thead>
      <tbody>${reqs.map(r => `
        <tr>
          <td>${esc(r.name)}</td>
          <td class="r num faint">${qty(r.per)} ${esc(r.unit)}</td>
          <td class="r num">${qty(r.per * count)} ${esc(r.unit)}</td>
          <td class="r num ${r.stock < r.per * count ? 'warn-text' : 'faint'}">${qty(r.stock)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;

  document.getElementById('bStart').disabled = count < 1;
}

function startBatch(){
  const recipe = findRecipe(document.getElementById('bRecipe').value);
  const count = plannedCount(recipe);
  if (count < 1){ toast('That comes out to zero candles', true); return; }

  const lines = requirements(recipe).map(r => ({
    kind: r.kind, id: r.id, name: r.name, unit: r.unit, qty: r.per * count
  }));

  lines.forEach(l => {
    const item = l.kind === 'container' ? findContainer(l.id) : findIngredient(l.id);
    if (item) item.stock = num(item.stock) - l.qty;
  });

  const b = costBreakdown(recipe);
  state.batches.push({
    id: uid(),
    recipeId: recipe.id,
    count,
    status: 'open',
    startedAt: new Date().toISOString(),
    completedAt: null,
    unitCost: b.total,
    lines
  });

  markDirty(); closeModal(); renderAll(); showView('batches');
  toast(count + ' candles started — materials deducted');
}

function completeBatch(id){
  const b = state.batches.find(x => x.id === id);
  if (!b || b.status !== 'open') return;
  b.status = 'complete';
  b.completedAt = new Date().toISOString();
  const f = finishedFor(b.recipeId);
  f.qty += num(b.count);
  f.totalCost += num(b.count) * num(b.unitCost);
  markDirty(); renderAll();
  toast(qty(b.count,0) + ' candles moved to finished stock');
}

function cancelBatch(id){
  const b = state.batches.find(x => x.id === id);
  if (!b || b.status !== 'open') return;
  (b.lines || []).forEach(l => {
    const item = l.kind === 'container' ? findContainer(l.id) : findIngredient(l.id);
    if (item) item.stock = num(item.stock) + num(l.qty);
  });
  b.status = 'cancelled';
  b.completedAt = new Date().toISOString();
  markDirty(); renderAll();
  toast('Batch cancelled — materials returned to the shelf');
}
</script>
<script>
/* =====================================================================
   FINISHED STOCK
   ===================================================================== */

function renderFinished(){
  const rows = state.finished
    .filter(f => f.qty !== 0 || f.totalCost !== 0)
    .map(f => {
      const r = findRecipe(f.recipeId);
      if (!r) return '';
      const b = costBreakdown(r);
      const avg = avgUnitCost(f.recipeId);
      return `<tr>
        <td class="tname">${esc(r.name)}</td>
        <td class="r num">${qty(f.qty,0)}</td>
        <td class="r num">${money(avg)}</td>
        <td class="r num">${money(f.totalCost)}</td>
        <td class="r num faint">${money(b.price)}</td>
        <td class="r num">${money(f.qty * b.price)}</td>
        <td class="r"><div class="row-actions">
          <button class="btn btn-sm" onclick="openSaleModal('${r.id}')" ${f.qty > 0 ? '' : 'disabled'}>Sell</button>
          <button class="btn btn-quiet btn-sm btn-warn" onclick="openWriteOffModal('${r.id}')" ${f.qty > 0 ? '' : 'disabled'}>Write off</button>
        </div></td>
      </tr>`;
    }).join('');

  const t = totals();

  document.getElementById('view-finished').innerHTML = `
    <div class="section-head">
      <div>
        <span class="eyebrow">On the shelf</span>
        <h2>Finished stock</h2>
        <p class="lede">Candles that exist. Unit cost is the average of what the batches behind them actually cost.</p>
      </div>
      <button class="btn btn-solid" onclick="openSaleModal()" ${t.unitsOnHand > 0 ? '' : 'disabled'}>Log a sale</button>
    </div>
    <div class="panel">
      ${rows ? `
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Recipe</th><th class="r">On hand</th><th class="r">Avg unit cost</th>
          <th class="r">Value at cost</th><th class="r">Suggested price</th><th class="r">Value at price</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>` : `
      <div class="empty">
        <h4>Nothing finished yet</h4>
        <p>Candles land here when you mark a batch complete — not when you start it.</p>
        <button class="btn" onclick="showView('batches')">Go to batches</button>
      </div>`}
    </div>`;
}

function openWriteOffModal(recipeId){
  const r = findRecipe(recipeId);
  openModal(`
    <div class="modal-head"><h3>Write off — ${esc(r.name)}</h3><button class="x" onclick="closeModal()">&times;</button></div>
    <p class="dim" style="margin-top:0;">Breakage, samples, gifts, a bad cure. These leave stock without producing revenue, so they stay out of the margin figures.</p>
    <div class="field">
      <label for="woQty">How many (on hand: ${qty(onHand(recipeId),0)})</label>
      <input type="number" id="woQty" min="1" step="1" value="1">
    </div>
    <div class="modal-foot">
      <button class="btn btn-quiet" onclick="closeModal()">Cancel</button>
      <button class="btn btn-warn" onclick="applyWriteOff('${recipeId}')">Write off</button>
    </div>`);
}

function applyWriteOff(recipeId){
  const n = Math.floor(num(document.getElementById('woQty').value));
  const f = finishedFor(recipeId);
  if (n < 1 || n > f.qty){ toast('Enter a number you actually have', true); return; }
  const avg = avgUnitCost(recipeId);
  f.qty -= n;
  f.totalCost = Math.max(0, f.totalCost - n * avg);
  markDirty(); closeModal(); renderAll();
  toast(n + ' written off');
}

/* =====================================================================
   SALES
   ===================================================================== */

function renderSales(){
  const t = totals();
  const sales = state.sales.slice().sort((a,b) => (b.date || '').localeCompare(a.date || ''));

  const byChannel = CHANNELS.map(ch => {
    const rows = state.sales.filter(s => (s.channel || 'Other') === ch);
    const revenue = rows.reduce((s,x) => s + num(x.qty) * num(x.unitPrice), 0);
    const cost = rows.reduce((s,x) => s + num(x.qty) * num(x.unitCost), 0);
    const units = rows.reduce((s,x) => s + num(x.qty), 0);
    return {ch, revenue, cost, units, margin: revenue - cost};
  }).filter(c => c.units > 0);

  const maxRev = Math.max(1, ...byChannel.map(c => c.revenue));

  document.getElementById('view-sales').innerHTML = `
    <div class="section-head">
      <div>
        <span class="eyebrow">What left the shelf</span>
        <h2>Sales</h2>
        <p class="lede">Every sale carries the cost of the candle sold, so margin is what actually happened rather than what the recipe hoped for.</p>
      </div>
      <button class="btn btn-solid" onclick="openSaleModal()" ${t.unitsOnHand > 0 || state.sales.length ? '' : 'disabled'}>Log a sale</button>
    </div>

    <div class="grid g4" style="margin-bottom:18px;">
      <div class="stat"><div class="k">Revenue</div><div class="v num">${money(t.revenue)}</div></div>
      <div class="stat"><div class="k">Cost of goods</div><div class="v num">${money(t.cogs)}</div></div>
      <div class="stat"><div class="k">Margin</div><div class="v num">${money(t.margin)}</div>
        <div class="note">${isNaN(t.marginPct) ? '—' : pct(t.marginPct)}</div></div>
      <div class="stat"><div class="k">Candles sold</div><div class="v num">${qty(t.unitsSold,0)}</div></div>
    </div>

    ${byChannel.length ? `
    <div class="panel">
      <div class="panel-head"><h3>Where it sold</h3><span class="eyebrow">revenue by channel</span></div>
      ${byChannel.map(c => `
        <div style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;font-size:.84rem;">
            <span>${esc(c.ch)} <span class="faint">· ${qty(c.units,0)} candles</span></span>
            <span class="mono">${money(c.revenue)} <span class="faint">/ ${money(c.margin)} kept</span></span>
          </div>
          <div class="bar-mini"><span style="width:${(c.revenue / maxRev) * 100}%"></span></div>
        </div>`).join('')}
    </div>` : ''}

    <div class="panel">
      <div class="panel-head"><h3>Sale ledger</h3><span class="eyebrow">${sales.length} entr${sales.length === 1 ? 'y' : 'ies'}</span></div>
      ${sales.length ? `
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Date</th><th>Recipe</th><th>Channel</th>
          <th class="r">Qty</th><th class="r">Price each</th><th class="r">Cost each</th>
          <th class="r">Revenue</th><th class="r">Margin</th><th></th>
        </tr></thead>
        <tbody>${sales.map(s => {
          const r = findRecipe(s.recipeId);
          const rev = num(s.qty) * num(s.unitPrice);
          const marg = rev - num(s.qty) * num(s.unitCost);
          return `<tr>
            <td class="num nowrap">${niceDate(s.date)}</td>
            <td class="tname">${r ? esc(r.name) : 'Deleted recipe'}${s.notes ? `<span class="tsub">${esc(s.notes)}</span>` : ''}</td>
            <td><span class="tag">${esc(s.channel || 'Other')}</span></td>
            <td class="r num">${qty(s.qty,0)}</td>
            <td class="r num">${money(s.unitPrice)}</td>
            <td class="r num faint">${money(s.unitCost)}</td>
            <td class="r num">${money(rev)}</td>
            <td class="r num ${marg < 0 ? 'warn-text' : ''}">${money(marg)}</td>
            <td class="r"><button class="btn btn-quiet btn-sm btn-warn" onclick="removeSale('${s.id}')">Undo</button></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>` : `
      <div class="empty">
        <h4>No sales recorded</h4>
        <p>Log what sells and the dashboard stops guessing — real price, real margin, real sell-through per recipe.</p>
        <button class="btn" onclick="openSaleModal()" ${t.unitsOnHand > 0 ? '' : 'disabled'}>Log a sale</button>
      </div>`}
    </div>`;
}

function openSaleModal(recipeId){
  const stocked = state.finished.filter(f => f.qty > 0 && findRecipe(f.recipeId));
  if (!stocked.length){ toast('No finished candles to sell yet', true); return; }
  const sel = recipeId && stocked.some(f => f.recipeId === recipeId) ? recipeId : stocked[0].recipeId;

  openModal(`
    <div class="modal-head"><h3>Log a sale</h3><button class="x" onclick="closeModal()">&times;</button></div>
    <div class="field">
      <label for="sRecipe">Recipe</label>
      <select id="sRecipe" onchange="saleRecipeChanged()">
        ${stocked.map(f => {
          const r = findRecipe(f.recipeId);
          return `<option value="${f.recipeId}" ${f.recipeId === sel ? 'selected' : ''}>${esc(r.name)} — ${qty(f.qty,0)} on hand</option>`;
        }).join('')}
      </select>
    </div>
    <div class="inline-fields three">
      <div class="field">
        <label for="sQty">Candles sold</label>
        <input type="number" id="sQty" min="1" step="1" value="1" oninput="saleRecalc()">
      </div>
      <div class="field">
        <label for="sPrice">Price each</label>
        <input type="number" id="sPrice" min="0" step="0.01" value="" oninput="saleRecalc()">
      </div>
      <div class="field">
        <label for="sDate">Date</label>
        <input type="date" id="sDate" value="${today()}">
      </div>
    </div>
    <div class="inline-fields">
      <div class="field">
        <label for="sChannel">Channel</label>
        <select id="sChannel">${CHANNELS.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label for="sNotes">Note</label>
        <input type="text" id="sNotes" placeholder="market name, buyer, order number">
      </div>
    </div>
    <div id="saleReadout"></div>
    <div class="modal-foot">
      <button class="btn btn-quiet" onclick="closeModal()">Cancel</button>
      <button class="btn btn-solid" id="sSave" onclick="saveSale()">Record sale</button>
    </div>`);
  saleRecipeChanged();
}

function saleRecipeChanged(){
  const id = document.getElementById('sRecipe').value;
  const r = findRecipe(id);
  const b = costBreakdown(r);
  const priceEl = document.getElementById('sPrice');
  if (priceEl && !priceEl.dataset.touched) priceEl.value = b.price.toFixed(2);
  saleRecalc();
}

function saleRecalc(){
  const id = document.getElementById('sRecipe').value;
  const r = findRecipe(id);
  const b = costBreakdown(r);
  const n = Math.floor(num(document.getElementById('sQty').value));
  const price = num(document.getElementById('sPrice').value);
  const cost = avgUnitCost(id);
  const hand = onHand(id);
  const revenue = n * price;
  const margin = revenue - n * cost;
  const over = n > hand;

  document.getElementById('sPrice').dataset.touched = '1';
  document.getElementById('saleReadout').innerHTML = `
    <div class="grid g3">
      <div class="stat"><div class="k">Revenue</div><div class="v num sm">${money(revenue)}</div></div>
      <div class="stat"><div class="k">Cost of goods</div><div class="v num sm">${money(n * cost)}</div>
        <div class="note">${money(cost)} each</div></div>
      <div class="stat ${margin < 0 ? 'lit' : ''}"><div class="k">Margin</div><div class="v num sm">${money(margin)}</div>
        <div class="note">${revenue > 0 ? pct((margin / revenue) * 100) : '—'}</div></div>
    </div>
    ${price < b.price ? `<p class="hint">Suggested price is ${money(b.price)}. Selling under it is fine — the ledger records what you charged.</p>` : ''}
    ${over ? `<p class="hint warn-text">Only ${qty(hand,0)} on hand.</p>` : ''}`;

  document.getElementById('sSave').disabled = n < 1 || over;
}

function saveSale(){
  const recipeId = document.getElementById('sRecipe').value;
  const n = Math.floor(num(document.getElementById('sQty').value));
  const f = finishedFor(recipeId);
  if (n < 1 || n > f.qty){ toast('You do not have that many on hand', true); return; }

  const unitCostAtSale = avgUnitCost(recipeId);
  state.sales.push({
    id: uid(),
    recipeId,
    qty: n,
    unitPrice: num(document.getElementById('sPrice').value),
    unitCost: unitCostAtSale,
    channel: document.getElementById('sChannel').value,
    date: document.getElementById('sDate').value || today(),
    notes: document.getElementById('sNotes').value.trim()
  });

  f.qty -= n;
  f.totalCost = Math.max(0, f.totalCost - n * unitCostAtSale);

  markDirty(); closeModal(); renderAll(); showView('sales');
  toast(n + ' sold — stock updated');
}

function removeSale(id){
  const s = state.sales.find(x => x.id === id);
  if (!s) return;
  const f = finishedFor(s.recipeId);
  f.qty += num(s.qty);
  f.totalCost += num(s.qty) * num(s.unitCost);
  state.sales = state.sales.filter(x => x.id !== id);
  markDirty(); renderAll();
  toast('Sale reversed — candles back on the shelf');
}
</script>
<script>
/* =====================================================================
   WIRING
   ===================================================================== */

document.getElementById('saveBtn').addEventListener('click', saveFile);

document.getElementById('loadBtn').addEventListener('click', () => {
  if (dirty && !confirm('Unsaved changes will be lost when a file is loaded. Continue?')) return;
  document.getElementById('loadFileInput').click();
});

document.getElementById('loadFileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      loadFromText(ev.target.result);
      toast('Ledger loaded');
    } catch (err) {
      toast('Could not load: ' + err.message, true);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => showView(tab.dataset.view));
});

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target.id === 'modalOverlay') closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

window.addEventListener('beforeunload', e => {
  if (dirty){ e.preventDefault(); e.returnValue = ''; }
});

renderAll();
window.__WL_READY__ = true;
</script>
</body>
</html>
