<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wick &amp; Ledger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root{
  --void:#000000;
  --panel:#070707;
  --raise:#111111;
  --white:#FFFFFF;
  --dim:rgba(255,255,255,.62);
  --faint:rgba(255,255,255,.38);
  --ghost:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.22);
  --line-lit:rgba(255,255,255,.55);
  --flame:#E9A13B;
  --flame-soft:rgba(233,161,59,.16);
  --r:2px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--void);
  color:var(--white);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{margin:0;font-family:'Bodoni Moda',Georgia,serif;font-weight:400;letter-spacing:.01em;}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:.66rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--faint);
}
a{color:var(--white);}
::selection{background:var(--white);color:var(--void);}
:focus-visible{outline:1px solid var(--white);outline-offset:2px;}

/* ============ HEADER ============ */
.app-header{
  position:sticky;top:0;z-index:60;
  background:var(--void);
  border-bottom:1px solid var(--line);
  padding:16px 26px;
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:14px;}
.taper{position:relative;width:16px;height:34px;flex-shrink:0;}
.taper .body{
  position:absolute;bottom:0;left:3px;
  width:10px;height:25px;
  border:1px solid var(--line-lit);
  border-bottom:none;
  background:linear-gradient(to top,rgba(255,255,255,.10),transparent);
}
.taper .wick{position:absolute;top:9px;left:50%;width:1px;height:6px;background:var(--line-lit);transform:translateX(-50%);}
.taper .flame{
  position:absolute;top:0;left:50%;
  width:7px;height:11px;
  transform:translateX(-50%);
  background:var(--flame);
  border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
  filter:blur(.3px);
  animation:flicker 3.4s ease-in-out infinite;
}
@keyframes flicker{
  0%,100%{opacity:.92;transform:translateX(-50%) scaleY(1);}
  40%{opacity:1;transform:translateX(-50%) scaleY(1.1);}
  70%{opacity:.8;transform:translateX(-50%) scaleY(.94);}
}
.brand h1{font-size:1.32rem;line-height:1.1;}
.brand .amp{font-style:italic;}
.brand .sub{display:block;margin-top:3px;}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.save-state{display:flex;align-items:center;gap:7px;font-size:.72rem;color:var(--faint);font-family:'IBM Plex Mono',monospace;}
.save-state .pip{width:6px;height:6px;border:1px solid var(--line-lit);}
.save-state.dirty{color:var(--flame);}
.save-state.dirty .pip{background:var(--flame);border-color:var(--flame);}
#loadFileInput{display:none;}

/* ============ TABS ============ */
.tabbar{
  position:sticky;top:67px;z-index:55;
  display:flex;overflow-x:auto;
  background:var(--void);
  border-bottom:1px solid var(--line);
  padding:0 26px;
  scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{display:none;}
.tab{
  padding:13px 20px;
  font-size:.74rem;
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--faint);
  cursor:pointer;
  white-space:nowrap;
  border-bottom:1px solid transparent;
  margin-bottom:-1px;
  transition:color .15s;
}
.tab:hover{color:var(--dim);}
.tab.active{color:var(--white);border-bottom-color:var(--white);}

/* ============ LAYOUT ============ */
.view{max-width:1180px;margin:0 auto;padding:30px 26px 90px;}
.view-section{display:none;}
.view-section.active{display:block;}
.section-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
  padding-bottom:12px;margin-bottom:22px;
  border-bottom:1px solid var(--line);
}
.section-head h2{font-size:1.55rem;}
.section-head .lede{color:var(--dim);font-size:.85rem;margin-top:4px;max-width:56ch;}

.panel{
  border:1px solid var(--line);
  background:var(--panel);
  padding:20px;
  margin-bottom:18px;
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:16px;
}
.panel-head h3{font-size:1.05rem;}

.grid{display:grid;gap:16px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 15px;
  border:1px solid var(--line-lit);
  background:transparent;
  color:var(--white);
  font-size:.74rem;
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.1em;
  text-transform:uppercase;
  border-radius:var(--r);
  cursor:pointer;
  transition:background .14s,color .14s,border-color .14s;
}
.btn:hover{background:var(--white);color:var(--void);border-color:var(--white);}
.btn-solid{background:var(--white);color:var(--void);border-color:var(--white);}
.btn-solid:hover{background:transparent;color:var(--white);}
.btn-quiet{border-color:var(--ghost);color:var(--dim);}
.btn-quiet:hover{background:transparent;border-color:var(--white);color:var(--white);}
.btn-sm{padding:5px 11px;font-size:.66rem;}
.btn-warn:hover{background:var(--flame);border-color:var(--flame);color:var(--void);}
.btn:disabled{opacity:.3;cursor:not-allowed;}
.btn:disabled:hover{background:transparent;color:var(--white);border-color:var(--line-lit);}
.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}

/* ============ FORMS ============ */
.field{margin-bottom:14px;}
.field label,.lbl{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-bottom:6px;
}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;
  padding:9px 11px;
  background:var(--raise);
  border:1px solid var(--line);
  border-radius:var(--r);
  color:var(--white);
  font-family:'IBM Plex Mono',monospace;
  font-size:.86rem;
}
input[type=text],textarea{font-family:'IBM Plex Sans',sans-serif;}
input:focus,select:focus,textarea:focus{border-color:var(--white);outline:none;}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;}
input::placeholder,textarea::placeholder{color:var(--ghost);}
.hint{font-size:.72rem;color:var(--faint);margin-top:5px;}
.inline-fields{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);}
.inline-fields.three{grid-template-columns:repeat(3,1fr);}

.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
.seg button{
  flex:1;padding:9px 8px;
  background:transparent;border:none;
  border-right:1px solid var(--line);
  color:var(--faint);
  font-family:'IBM Plex Mono',monospace;
  font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;
}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--white);color:var(--void);}

/* ============ TABLES ============ */
table{width:100%;border-collapse:collapse;}
th{
  text-align:left;
  font-family:'IBM Plex Mono',monospace;
  font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);font-weight:400;
  padding:0 12px 9px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
td{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,.09);
  font-size:.86rem;
  vertical-align:middle;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,.035);}
.r{text-align:right;}
.tname{font-weight:500;}
.tsub{display:block;font-size:.72rem;color:var(--faint);margin-top:2px;}
.table-wrap{overflow-x:auto;}

.tag{
  display:inline-block;
  padding:2px 8px;
  border:1px solid var(--line);
  border-radius:var(--r);
  font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);
}
.tag-lit{border-color:var(--flame);color:var(--flame);}
.tag-solid{background:var(--white);color:var(--void);border-color:var(--white);}

/* ============ STATS ============ */
.stat{border:1px solid var(--line);padding:15px 16px;background:var(--panel);}
.stat .k{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
.stat .v{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;margin-top:7px;font-variant-numeric:tabular-nums;}
.stat .v.sm{font-size:1.15rem;}
.stat .note{font-size:.72rem;color:var(--faint);margin-top:4px;}
.stat.lit{border-color:var(--flame);}
.stat.lit .v{color:var(--flame);}

/* ============ MELT BAR (signature) ============ */
.melt{margin-top:6px;}
.melt-bar{
  display:flex;height:38px;
  border:1px solid var(--line-lit);
  background:var(--void);
  overflow:hidden;
}
.melt-seg{position:relative;min-width:2px;border-right:1px solid var(--void);}
.melt-seg:last-child{border-right:none;}
.melt-legend{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:9px 16px;margin-top:14px;
}
.leg{display:flex;align-items:center;gap:9px;font-size:.76rem;}
.leg .sw{width:15px;height:15px;border:1px solid var(--line-lit);flex-shrink:0;}
.leg .nm{color:var(--dim);flex:1;}
.leg .vl{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
.leg.zero{opacity:.32;}

/* engraved fills — the melt bar reads as hatching, not color */
.f-wax{background:rgba(255,255,255,.92);}
.f-fragrance{background:repeating-linear-gradient(45deg,rgba(255,255,255,.85) 0 3px,transparent 3px 7px);}
.f-wick{background:repeating-linear-gradient(90deg,rgba(255,255,255,.85) 0 1px,transparent 1px 5px);}
.f-dye{background-color:transparent;background-image:radial-gradient(rgba(255,255,255,.85) 1.1px,transparent 1.2px);background-size:6px 6px;}
.f-container{background:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 1px,transparent 1px 6px),repeating-linear-gradient(-45deg,rgba(255,255,255,.55) 0 1px,transparent 1px 6px);}
.f-packaging{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.85) 0 3px,transparent 3px 9px);}
.f-labor{background:repeating-linear-gradient(0deg,rgba(255,255,255,.85) 0 1px,transparent 1px 5px);}
.f-overhead{background:rgba(255,255,255,.26);}

/* ============ MODAL ============ */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.86);
  backdrop-filter:blur(2px);
  display:none;align-items:flex-start;justify-content:center;
  padding:34px 18px;overflow-y:auto;
}
.modal-overlay.open{display:flex;}
.modal{
  width:100%;max-width:660px;
  background:var(--void);
  border:1px solid var(--line-lit);
  padding:26px;
}
.modal.wide{max-width:860px;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line);}
.modal-head h3{font-size:1.3rem;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);}
.x{background:none;border:none;color:var(--faint);font-size:1.3rem;cursor:pointer;line-height:1;padding:0 4px;}
.x:hover{color:var(--white);}

.sub-row{
  display:grid;gap:10px;align-items:end;
  grid-template-columns:1fr 92px 34px;
  margin-bottom:10px;
}
.icon-btn{
  width:34px;height:36px;
  border:1px solid var(--line);background:transparent;color:var(--faint);
  cursor:pointer;border-radius:var(--r);font-size:1rem;line-height:1;
}
.icon-btn:hover{border-color:var(--white);color:var(--white);}

/* ============ MISC ============ */
.empty{
  border:1px dashed var(--line);
  padding:38px 24px;text-align:center;
}
.empty h4{font-size:1.05rem;margin-bottom:7px;}
.empty p{color:var(--faint);font-size:.84rem;margin:0 0 16px;max-width:44ch;margin-left:auto;margin-right:auto;}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120%);
  background:var(--white);color:var(--void);
  padding:11px 20px;
  font-family:'IBM Plex Mono',monospace;font-size:.76rem;letter-spacing:.04em;
  z-index:300;transition:transform .26s cubic-bezier(.2,.8,.3,1);
  max-width:88vw;
}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.warn{background:var(--flame);}
.divider{height:1px;background:var(--line);margin:22px 0;}
.warn-text{color:var(--flame);}
.dim{color:var(--dim);}
.faint{color:var(--faint);}
.mono{font-family:'IBM Plex Mono',monospace;}
.nowrap{white-space:nowrap;}
.bar-mini{height:4px;background:rgba(255,255,255,.14);position:relative;margin-top:6px;}
.bar-mini span{position:absolute;left:0;top:0;bottom:0;background:var(--white);}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
}
@media (max-width:860px){
  .g4{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:620px){
  .view{padding:22px 16px 80px;}
  .app-header{padding:14px 16px;}
  .tabbar{padding:0 16px;top:63px;}
  .tab{padding:12px 14px;}
  .g2,.g3,.g4{grid-template-columns:1fr;}
  .inline-fields,.inline-fields.three{grid-template-columns:1fr;}
  .modal{padding:20px 16px;}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <div class="taper" aria-hidden="true">
      <div class="flame"></div><div class="wick"></div><div class="body"></div>
    </div>
    <div>
      <h1>Wick <span class="amp">&amp;</span> Ledger</h1>
      <span class="eyebrow sub">Poe&rsquo;s Apothecary</span>
    </div>
  </div>
  <div class="header-actions">
    <span class="save-state" id="saveState"><span class="pip"></span><span id="saveStateText">Saved to file</span></span>
    <button class="btn btn-quiet btn-sm" id="loadBtn">Load file</button>
    <input type="file" id="loadFileInput" accept="application/json">
    <button class="btn btn-solid btn-sm" id="saveBtn">Save file</button>
  </div>
</header>

<nav class="tabbar" id="tabbar">
  <div class="tab active" data-view="dashboard">Dashboard</div>
  <div class="tab" data-view="containers">Containers</div>
  <div class="tab" data-view="ingredients">Ingredients</div>
  <div class="tab" data-view="recipes">Recipes</div>
  <div class="tab" data-view="batches">Batches</div>
  <div class="tab" data-view="finished">Finished stock</div>
  <div class="tab" data-view="sales">Sales</div>
</nav>

<main class="view">
  <section class="view-section active" id="view-dashboard"></section>
  <section class="view-section" id="view-containers"></section>
  <section class="view-section" id="view-ingredients"></section>
  <section class="view-section" id="view-recipes"></section>
  <section class="view-section" id="view-batches"></section>
  <section class="view-section" id="view-finished"></section>
  <section class="view-section" id="view-sales"></section>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>
<script>
/* =====================================================================
   WICK & LEDGER — candle studio ledger for Poe's Apothecary
   Single file. No server, no autosave. All data lives in `state` and
   moves in and out through Save file / Load file (one JSON document).
   ===================================================================== */

const SCHEMA = 3;

/* Wax fill ratio: ounces of wax by weight per fluid ounce of container
   volume. ~0.86 is the common working figure for soy in glass. It is a
   setting, not a constant — override globally or per recipe. */
const DEFAULT_FILL_RATIO = 0.86;

const CATEGORIES = [
  {id:'wax',       label:'Wax',       unit:'oz'},
  {id:'fragrance', label:'Fragrance', unit:'oz'},
  {id:'wick',      label:'Wick',      unit:'each'},
  {id:'dye',       label:'Dye',       unit:'g'},
  {id:'packaging', label:'Packaging', unit:'each'},
  {id:'other',     label:'Other',     unit:'each'}
];

const COST_KEYS = [
  {key:'wax',       label:'Wax',       fill:'f-wax'},
  {key:'fragrance', label:'Fragrance', fill:'f-fragrance'},
  {key:'wick',      label:'Wick',      fill:'f-wick'},
  {key:'dye',       label:'Dye',       fill:'f-dye'},
  {key:'container', label:'Container', fill:'f-container'},
  {key:'packaging', label:'Packaging', fill:'f-packaging'},
  {key:'labor',     label:'Labor',     fill:'f-labor'},
  {key:'overhead',  label:'Overhead',  fill:'f-overhead'}
];

const CHANNELS = ['Etsy','Market','Direct','Wholesale','Other'];

function emptyState(){
  return {
    schema: SCHEMA,
    settings:{
      laborRate: 22,
      markup: 2.5,
      overhead: 1.50,
      fillRatio: DEFAULT_FILL_RATIO,
      minutesPerCandle: 6
    },
    containers: [],
    ingredients: [],
    recipes: [],
    batches: [],
    finished: [],   // {recipeId, qty, totalCost}
    sales: []       // {id, recipeId, qty, unitPrice, unitCost, channel, date, notes}
  };
}

var state = emptyState();
var dirty = false;

function markDirty(){
  dirty = true;
  document.getElementById('saveState').classList.add('dirty');
  document.getElementById('saveStateText').textContent = 'Unsaved changes';
}
function markClean(){
  dirty = false;
  document.getElementById('saveState').classList.remove('dirty');
  document.getElementById('saveStateText').textContent = 'Saved to file';
}

/* ---------------------- utilities ---------------------- */

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function money(n){
  if (n === null || n === undefined || isNaN(n)) n = 0;
  const neg = n < 0;
  return (neg ? '-$' : '$') + Math.abs(n).toFixed(2);
}
function qty(n, dp){
  if (dp === undefined) dp = 2;
  if (n === null || n === undefined || isNaN(n)) return '0';
  return Number(n).toFixed(dp).replace(/\.?0+$/,'') || '0';
}
function pct(n){
  if (!isFinite(n) || isNaN(n)) return '—';
  return n.toFixed(1) + '%';
}
function num(v, fallback){
  const n = parseFloat(v);
  return isNaN(n) ? (fallback === undefined ? 0 : fallback) : n;
}
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function today(){ return new Date().toISOString().slice(0,10); }
function niceDate(iso){
  if (!iso) return '—';
  const d = new Date(iso.length <= 10 ? iso + 'T12:00:00' : iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

function findIngredient(id){ return state.ingredients.find(i => i.id === id) || null; }
function findContainer(id){ return state.containers.find(c => c.id === id) || null; }
function findRecipe(id){ return state.recipes.find(r => r.id === id) || null; }
function ingredientsOf(cat){ return state.ingredients.filter(i => i.category === cat); }

/* Unit cost for an ingredient, whether entered directly or derived
   from a bulk purchase. */
function unitCost(ing){
  if (!ing) return 0;
  if (ing.costMode === 'bulk'){
    const q = num(ing.bulkQty);
    return q > 0 ? num(ing.bulkCost) / q : 0;
  }
  return num(ing.unitCost);
}
function categoryUnit(cat){
  const c = CATEGORIES.find(c => c.id === cat);
  return c ? c.unit : 'each';
}

/* ---------------------- toast ---------------------- */

var toastTimer = null;
function toast(msg, isWarn){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('warn', !!isWarn);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ---------------------- modal ---------------------- */

function openModal(html, wide){
  const m = document.getElementById('modalContent');
  m.className = 'modal' + (wide ? ' wide' : '');
  m.innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
  const first = m.querySelector('input,select,textarea');
  if (first && first.focus) setTimeout(() => first.focus(), 30);
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalContent').innerHTML = '';
}

/* ---------------------- save / load ---------------------- */

function saveFile(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'wick-and-ledger-' + today() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  markClean();
  toast('Saved — file downloaded');
}

/* Older files are missing newer fields. Fill them in rather than
   rejecting the file. */
function migrate(loaded){
  /* Keep the defaults in a separate object — assigning `loaded` over
     them first would replace the settings block wholesale and lose any
     key the older file never knew about. */
  const defaults = emptyState();
  const s = Object.assign({}, defaults, loaded);
  s.schema = SCHEMA;
  s.settings = Object.assign({}, defaults.settings, loaded.settings || {});
  ['containers','ingredients','recipes','batches','finished','sales'].forEach(k => {
    if (!Array.isArray(s[k])) s[k] = [];
  });
  s.containers.forEach(c => {
    if (c.stock === undefined) c.stock = 0;
    if (c.lowAt === undefined) c.lowAt = 0;
  });
  s.ingredients.forEach(i => {
    if (i.stock === undefined) i.stock = 0;
    if (i.lowAt === undefined) i.lowAt = 0;
    if (!i.costMode) i.costMode = 'unit';
  });
  s.recipes.forEach(r => {
    if (!Array.isArray(r.wicks)) r.wicks = [];
    if (!Array.isArray(r.packaging)) r.packaging = [];
    if (r.minutes === undefined) r.minutes = s.settings.minutesPerCandle;
    if (r.fillRatio === undefined) r.fillRatio = s.settings.fillRatio;
  });
  s.finished.forEach(f => {
    if (f.totalCost === undefined) f.totalCost = 0;
    if (f.qty === undefined) f.qty = 0;
  });
  return s;
}

function loadFromText(text){
  const loaded = JSON.parse(text);
  if (!loaded || typeof loaded !== 'object' || !Array.isArray(loaded.recipes)){
    throw new Error('That file is not a Wick & Ledger ledger.');
  }
  state = migrate(loaded);
  markClean();
  renderAll();
}

/* ---------------------- navigation ---------------------- */

function showView(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
  document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
  const el = document.getElementById('view-' + name);
  if (el) el.classList.add('active');
  const fn = window['render' + name.charAt(0).toUpperCase() + name.slice(1)];
  if (fn) fn();
  try{ window.scrollTo({top:0,behavior:'instant'}); }catch(e){}
}

function renderAll(){
  renderDashboard();
  renderContainers();
  renderIngredients();
  renderRecipes();
  renderBatches();
  renderFinished();
  renderSales();
}

<script>
/* =====================================================================
   COST ENGINE
   ===================================================================== */

/* Wax poured per candle. In volume mode it comes from the container
   size and the fill ratio; in weight mode it's entered directly. */
function waxPerCandle(recipe){
  if (!recipe) return 0;
  if (recipe.fillMode === 'weight') return num(recipe.waxOz);
  const c = findContainer(recipe.containerId);
  if (!c) return 0;
  const ratio = num(recipe.fillRatio, state.settings.fillRatio);
  return num(c.volume) * ratio;
}

/* Fragrance load is a percentage of wax weight. */
function fragrancePerCandle(recipe){
  if (!recipe || !recipe.fragranceId) return 0;
  return waxPerCandle(recipe) * (num(recipe.fragrancePct) / 100);
}

function costBreakdown(recipe){
  const b = {wax:0,fragrance:0,wick:0,dye:0,container:0,packaging:0,labor:0,overhead:0};
  if (!recipe) return Object.assign(b,{total:0,price:0});

  b.wax = waxPerCandle(recipe) * unitCost(findIngredient(recipe.waxId));
  b.fragrance = fragrancePerCandle(recipe) * unitCost(findIngredient(recipe.fragranceId));

  (recipe.wicks || []).forEach(w => {
    b.wick += num(w.qty) * unitCost(findIngredient(w.id));
  });
  (recipe.packaging || []).forEach(p => {
    b.packaging += num(p.qty) * unitCost(findIngredient(p.id));
  });

  if (recipe.dyeId) b.dye = num(recipe.dyeAmt) * unitCost(findIngredient(recipe.dyeId));

  const c = findContainer(recipe.containerId);
  if (c) b.container = num(c.cost);

  const minutes = num(recipe.minutes, state.settings.minutesPerCandle);
  b.labor = (minutes / 60) * num(state.settings.laborRate);

  b.overhead = recipe.overheadOverride === null || recipe.overheadOverride === undefined
    ? num(state.settings.overhead)
    : num(recipe.overheadOverride);

  b.total = COST_KEYS.reduce((s,k) => s + b[k.key], 0);
  const markup = recipe.markupOverride === null || recipe.markupOverride === undefined
    ? num(state.settings.markup, 1)
    : num(recipe.markupOverride, 1);
  b.markup = markup;
  b.price = b.total * markup;
  return b;
}

/* Everything one candle of this recipe consumes, as a flat list. Used
   for batch deduction and for max-from-stock scaling. */
function requirements(recipe){
  const out = [];
  const add = (kind, id, per) => {
    if (!id || per <= 0) return;
    const found = out.find(r => r.kind === kind && r.id === id);
    if (found) found.per += per;
    else out.push({kind, id, per});
  };

  add('ingredient', recipe.waxId, waxPerCandle(recipe));
  add('ingredient', recipe.fragranceId, fragrancePerCandle(recipe));
  if (recipe.dyeId) add('ingredient', recipe.dyeId, num(recipe.dyeAmt));
  (recipe.wicks || []).forEach(w => add('ingredient', w.id, num(w.qty)));
  (recipe.packaging || []).forEach(p => add('ingredient', p.id, num(p.qty)));
  if (recipe.containerId) add('container', recipe.containerId, 1);

  return out.map(r => {
    const src = r.kind === 'container' ? findContainer(r.id) : findIngredient(r.id);
    return Object.assign(r, {
      name: src ? src.name : 'Missing item',
      unit: r.kind === 'container' ? 'each' : categoryUnit(src ? src.category : 'other'),
      stock: src ? num(src.stock) : 0
    });
  });
}

/* How many candles the shelf can actually support, and what runs out
   first. */
function maxFromStock(recipe){
  const reqs = requirements(recipe);
  if (!reqs.length) return {count:0, limiter:null};
  let count = Infinity, limiter = null;
  reqs.forEach(r => {
    const possible = r.per > 0 ? Math.floor(r.stock / r.per) : Infinity;
    if (possible < count){ count = possible; limiter = r; }
  });
  if (!isFinite(count)) count = 0;
  return {count: Math.max(0, count), limiter};
}

/* Anything short for a run of `count` candles. */
function shortages(recipe, count){
  return requirements(recipe)
    .map(r => ({...r, need: r.per * count, short: (r.per * count) - r.stock}))
    .filter(r => r.short > 0.0001);
}

/* ---------------------- finished stock ---------------------- */

function finishedFor(recipeId){
  let f = state.finished.find(f => f.recipeId === recipeId);
  if (!f){ f = {recipeId, qty:0, totalCost:0}; state.finished.push(f); }
  return f;
}
function avgUnitCost(recipeId){
  const f = state.finished.find(f => f.recipeId === recipeId);
  if (!f || f.qty <= 0) return 0;
  return f.totalCost / f.qty;
}
function onHand(recipeId){
  const f = state.finished.find(f => f.recipeId === recipeId);
  return f ? f.qty : 0;
}

/* ---------------------- sales rollup ---------------------- */

function recipeStats(recipeId){
  const sales = state.sales.filter(s => s.recipeId === recipeId);
  const unitsSold = sales.reduce((s,x) => s + num(x.qty), 0);
  const revenue = sales.reduce((s,x) => s + num(x.qty) * num(x.unitPrice), 0);
  const cogs = sales.reduce((s,x) => s + num(x.qty) * num(x.unitCost), 0);
  const made = state.batches
    .filter(b => b.recipeId === recipeId && b.status === 'complete')
    .reduce((s,b) => s + num(b.count), 0);
  const hand = onHand(recipeId);
  return {
    unitsSold, revenue, cogs,
    margin: revenue - cogs,
    marginPct: revenue > 0 ? ((revenue - cogs) / revenue) * 100 : NaN,
    avgPrice: unitsSold > 0 ? revenue / unitsSold : 0,
    made, onHand: hand,
    sellThrough: made > 0 ? (unitsSold / made) * 100 : NaN
  };
}

function totals(){
  const revenue = state.sales.reduce((s,x) => s + num(x.qty) * num(x.unitPrice), 0);
  const cogs = state.sales.reduce((s,x) => s + num(x.qty) * num(x.unitCost), 0);
  const unitsSold = state.sales.reduce((s,x) => s + num(x.qty), 0);
  const finishedValue = state.finished.reduce((s,f) => s + num(f.totalCost), 0);
  const unitsOnHand = state.finished.reduce((s,f) => s + num(f.qty), 0);
  const rawValue =
    state.ingredients.reduce((s,i) => s + num(i.stock) * unitCost(i), 0) +
    state.containers.reduce((s,c) => s + num(c.stock) * num(c.cost), 0);
  return {
    revenue, cogs, margin: revenue - cogs,
    marginPct: revenue > 0 ? ((revenue - cogs) / revenue) * 100 : NaN,
    unitsSold, finishedValue, unitsOnHand, rawValue
  };
}

/* ---------------------- melt bar ---------------------- */

/* The signature view: one candle's cost, stacked and hatched. Colour is
   deliberately absent — each component is a different engraving. */
function meltBar(b, opts){
  opts = opts || {};
  const total = b.total || 0;
  const segs = COST_KEYS.map(k => {
    const v = b[k.key] || 0;
    const share = total > 0 ? (v / total) * 100 : 0;
    return {...k, v, share};
  });
  const bar = segs.filter(s => s.share > 0)
    .map(s => `<div class="melt-seg ${s.fill}" style="width:${s.share}%" title="${esc(s.label)} ${money(s.v)}"></div>`)
    .join('');

  const legend = segs
    .filter(s => opts.hideZero ? s.v > 0 : true)
    .map(s => `<div class="leg${s.v > 0 ? '' : ' zero'}">
        <span class="sw ${s.fill}"></span>
        <span class="nm">${esc(s.label)}</span>
        <span class="vl">${money(s.v)}</span>
      </div>`).join('');

  return `<div class="melt">
    <div class="melt-bar">${bar || '<div class="melt-seg" style="width:100%"></div>'}</div>
    <div class="melt-legend">${legend}</div>
  </div>`;
}
</script>

function updateSetting(key, value){
  state.settings[key] = num(value);
  markDirty();
  renderAll();

}

function confirmReset(){
  openModal(`
    <div class="modal-head"><h3>Start an empty ledger?</h3><button class="x" onclick="closeModal()">&times;</button></div>
    <p class="dim" style="margin-top:0;">This clears everything in the browser — recipes, inventory, batches, sales. Any JSON file you have already saved is untouched, and you can load it back.</p>

      <button class="btn btn-quiet" onclick="closeModal()">Keep working</button>
      <button class="btn btn-warn" onclick="doReset()">Clear it</button>
    </div>`);
}
function doReset(){
  state = emptyState();
  markClean();
  closeModal();
  renderAll();
  toast('Ledger cleared');
}

<script>
/* =====================================================================
   CONTAINERS
   ===================================================================== */

function renderContainers(){
  const rows = state.containers.map(c => {
    const low = num(c.lowAt) > 0 && num(c.stock) <= num(c.lowAt);
    return `<tr>
      <td class="tname">${esc(c.name)}${c.notes ? `<span class="tsub">${esc(c.notes)}</span>` : ''}</td>
      <td class="r num">${qty(c.volume)} fl oz</td>
      <td class="r num">${money(num(c.cost))}</td>
      <td class="r num">${qty(c.stock,0)}${low ? ' <span class="tag tag-lit">low</span>' : ''}</td>
      <td class="r num faint">${qty(num(c.volume) * num(state.settings.fillRatio))} oz wax</td>
      <td class="r"><div class="row-actions">
        <button class="btn btn-quiet btn-sm" onclick="openStockModal('container','${c.id}')">Stock</button>
        <button class="btn btn-quiet btn-sm" onclick="openContainerModal('${c.id}')">Edit</button>

  document.getElementById('view-containers').innerHTML = `
    <div class="section-head">
      <div>
        <span class="eyebrow">Vessels</span>
        <h2>Containers</h2>

      </div>
      <button class="btn btn-solid" onclick="openContainerModal()">Add container</button>
    </div>
    <div class="panel">
      ${state.containers.length ? `
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Container</th><th class="r">Volume</th><th class="r">Cost each</th>
          <th class="r">On shelf</th><th class="r">Holds</th><th></th>

        <tbody>${rows}</tbody>
      </table></div>` : `
      <div class="empty">
        <h4>No containers yet</h4>
        <p>Add the jars and tins you pour into. Recipes in volume mode read their wax weight from the container size.</p>

      </div>`}

}

function openContainerModal(id){
  const c = id ? findContainer(id) : null;
  openModal(`

      <h3>${c ? 'Edit container' : 'Add container'}</h3>

      </div>
      <div class="field">

    </div>
    <div class="inline-fields">
      <div class="field">
        <label for="cLow">Warn at or below</label>

        <div class="hint">Leave at 0 for no warning.</div>
      </div>
      <div class="field">
        <label for="cNotes">Note</label>
        <input type="text" id="cNotes" value="${esc(c ? c.notes || '' : '')}" placeholder="supplier, lid type">

    <div class="modal-foot">
      <button class="btn btn-quiet" onclick="closeModal()">Cancel</button>

    </div>`);
}

function saveContainer(id){
  const name = document.getElementById('cName').value.trim();
  if (!name){ toast('Give the container a name', true); return; }
  const data = {
    name,
    volume: num(document.getElementById('cVol').value),
    cost: num(document.getElementById('cCost').value),
    stock: num(document.getElementById('cStock').value),
    lowAt: num(document.getElementById('cLow').value),
    notes: document.getElementById('cNotes').value.trim()
  };
  if (id) Object.assign(findContainer(id), data);
  else state.containers.push(Object.assign({id: uid()}, data));
  markDirty(); closeModal(); renderAll();
  toast(id ? 'Container updated' : 'Container added');
}

function removeContainer(id){
  const used = state.recipes.filter(r => r.containerId === id);
  if (used.length){
    toast('Used by ' + used.length + ' recipe' + (used.length === 1 ? '' : 's') + ' — change those first', true);
    return;
  }
  state.containers = state.containers.filter(c => c.id !== id);
  markDirty(); renderAll(); toast('Container deleted');
}

   INGREDIENTS
   ===================================================================== */

function renderIngredients(){
  const groups = CATEGORIES.map(cat => {
    const items = ingredientsOf(cat.id);
    if (!items.length) return '';
    return `
      <div class="panel">
